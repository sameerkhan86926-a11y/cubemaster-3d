<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - CubeMaster 3D</title>
    <link rel="canonical" href="https://cubemaster-3d.online/contact.html">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0b0812; color: #d4d4d8; line-height: 1.7; padding: 40px 20px; }
        .container { max-width: 760px; margin: 0 auto; background: #161024; border: 1px solid #2e2448; border-radius: 16px; padding: 32px; }
        h1 { color: #fff; margin-bottom: 12px; font-size: 28px; }
        p { margin-bottom: 16px; font-size: 15px; }
        .info-card { background: #1c142c; border: 1px solid #2e2448; border-radius: 12px; padding: 20px; margin: 20px 0; }
        .info-card h3 { color: #a879ff; margin-bottom: 8px; font-size: 17px; }
        .info-card p { margin-bottom: 8px; }
        form { display: grid; gap: 14px; margin-top: 20px; }
        label { font-size: 13px; font-weight: 600; color: #9c63ff; }
        input, textarea { width: 100%; padding: 12px; background: #0f0a1c; border: 1px solid #2e2448; border-radius: 8px; color: #fff; font-size: 14px; }
        input:focus, textarea:focus { border-color: #a879ff; outline: none; }
        button { padding: 12px 20px; background: linear-gradient(135deg, #a879ff, #7946dc); border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s ease; }
        button:hover { opacity: 0.92; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        a { color: #a879ff; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        .status-msg { margin-top: 10px; font-size: 14px; font-weight: 600; display: none; }
        .back-btn { display: inline-block; margin-top: 24px; padding: 10px 18px; background: #251b35; border: 1px solid #7946dc; border-radius: 8px; color: #fff; transition: 0.2s ease; }
        .back-btn:hover { background: #7946dc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Have questions, feedback, bug reports, or feature requests regarding CubeMaster 3D? Reach out to us directly.</p>

        <div class="info-card">
            <h3>Direct Contact</h3>
            <p><strong>Official Email:</strong> <a href="mailto:cubemaster3d.contact@gmail.com">cubemaster3d.contact@gmail.com</a></p>
            <p><strong>Platform:</strong> <a href="https://cubemaster-3d.online/">cubemaster-3d.online</a></p>
            <p><strong>Response Time:</strong> Typically within 24 to 48 hours</p>
        </div>

        <form id="contactForm">
            <div>
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>
            <div>
                <label for="message">Message / Feedback</label>
                <textarea id="message" name="message" rows="5" required placeholder="Describe your question or issue..."></textarea>
            </div>
            <button type="submit" id="submitBtn">Send Message</button>
            <div id="formStatus" class="status-msg"></div>
        </form>

        <a href="/index.html" class="back-btn">← Back to Solver</a>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const formStatus = document.getElementById('formStatus');

        // Yahan apna Google Apps Script Web App URL daalein
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxJHYynh1dA7PIATlINwHc3zE4f83lT5zoswiOuMjL4PTw91O2WZTFwdjWku6spqMOV/exec';

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            if (SCRIPT_URL === 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                alert('Please configure your Google Apps Script URL first.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Sending...';
            formStatus.style.display = 'block';
            formStatus.style.color = '#a879ff';
            formStatus.innerText = 'Transmitting your message...';

            const formData = new FormData(form);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors'
            })
            .then(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send Message';
                formStatus.style.color = '#4ade80';
                formStatus.innerText = 'Thank you! Your message has been sent successfully.';
                form.reset();
            })
            .catch(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send Message';
                formStatus.style.color = '#f87171';
                formStatus.innerText = 'Something went wrong. Please email us directly.';
            });
        });
    </script>
</body>
</html>
