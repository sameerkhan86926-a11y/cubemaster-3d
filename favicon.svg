<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c142c"/>
      <stop offset="100%" stop-color="#0a0712"/>
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a879ff"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Face Gradients -->
    <linearGradient id="topWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <linearGradient id="leftRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#c51616"/>
    </linearGradient>

    <linearGradient id="rightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a879ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- 3D Cube Icon -->
  <g filter="url(#glow)">
    <!-- Top Face (White/Silver) -->
    <polygon points="32,13 47,21 32,29 17,21" fill="url(#topWhite)"/>
    <line x1="22" y1="23.6" x2="42" y2="15.6" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="27" y1="26.3" x2="37" y2="18.3" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="24.5" y1="17" x2="39.5" y2="25" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="29.5" y1="14.3" x2="44.5" y2="22.3" stroke="#110e1a" stroke-width="1.2"/>

    <!-- Left Face (Red/Vibrant) -->
    <polygon points="17,21 32,29 32,47 17,39" fill="url(#leftRed)"/>
    <line x1="22" y1="23.6" x2="22" y2="41.6" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="27" y1="26.3" x2="27" y2="44.3" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="17" y1="27" x2="32" y2="35" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="17" y1="33" x2="32" y2="41" stroke="#110e1a" stroke-width="1.2"/>

    <!-- Right Face (Blue/Neon) -->
    <polygon points="32,29 47,21 47,39 32,47" fill="url(#rightBlue)"/>
    <line x1="37" y1="26.3" x2="37" y2="44.3" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="42" y1="23.6" x2="42" y2="41.6" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="32" y1="35" x2="47" y2="27" stroke="#110e1a" stroke-width="1.2"/>
    <line x1="32" y1="41" x2="47" y2="33" stroke="#110e1a" stroke-width="1.2"/>

    <!-- Outer Outline -->
    <polygon points="32,13 47,21 47,39 32,47 17,39 17,21" fill="none" stroke="#110e1a" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
