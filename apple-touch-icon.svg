<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1435"/>
      <stop offset="50%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#08050e"/>
    </linearGradient>

    <!-- Glow Radial -->
    <radialGradient id="neonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>

    <!-- Face Gradients -->
    <linearGradient id="faceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>

    <linearGradient id="faceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="faceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#a879ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- iOS Canvas Surface (Square - iOS applies its own squircle mask) -->
  <rect width="180" height="180" fill="url(#appleBg)"/>

  <!-- Radial Glow Behind Cube -->
  <circle cx="90" cy="85" r="75" fill="url(#neonAura)"/>

  <!-- 3D Isometric Cube -->
  <g filter="url(#cubeShadow)">
    <!-- Base Core Lines -->
    <polygon points="90,32 135,58 135,110 90,136 45,110 45,58" fill="#110d1a"/>

    <!-- TOP FACE -->
    <polygon points="90,34 133,59 90,84 47,59" fill="url(#faceTop)"/>
    <!-- Top Grid -->
    <line x1="61.3" y1="67.3" x2="118.7" y2="42.3" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="75.7" y1="75.7" x2="104.3" y2="50.7" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="68.7" y1="46.7" x2="111.3" y2="71.7" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="82.7" y1="38.7" x2="125.3" y2="63.7" stroke="#110d1a" stroke-width="2.6"/>

    <!-- LEFT FACE -->
    <polygon points="47,59 90,84 90,134 47,109" fill="url(#faceLeft)"/>
    <!-- Left Grid -->
    <line x1="61.3" y1="67.3" x2="61.3" y2="117.3" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="75.7" y1="75.7" x2="75.7" y2="125.7" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="47,75.7" x2="90,100.7" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="47,92.3" x2="90,117.3" stroke="#110d1a" stroke-width="2.6"/>

    <!-- RIGHT FACE -->
    <polygon points="90,84 133,59 133,109 90,134" fill="url(#faceRight)"/>
    <!-- Right Grid -->
    <line x1="104.3" y1="75.7" x2="104.3" y2="125.7" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="118.7" y1="67.3" x2="118.7" y2="117.3" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="90,100.7" x2="133,75.7" stroke="#110d1a" stroke-width="2.6"/>
    <line x1="90,117.3" x2="133,92.3" stroke="#110d1a" stroke-width="2.6"/>

    <!-- Inner Central Join Line -->
    <line x1="90" y1="84" x2="90" y2="134" stroke="#110d1a" stroke-width="3"/>
    <line x1="47" y1="59" x2="90" y2="84" stroke="#110d1a" stroke-width="3"/>
    <line x1="133" y1="59" x2="90" y2="84" stroke="#110d1a" stroke-width="3"/>
    
    <!-- Outer Contour -->
    <polygon points="90,34 133,59 133,109 90,134 47,109 47,59" fill="none" stroke="#110d1a" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Accent Indicator Dot -->
  <circle cx="90" cy="154" r="3.5" fill="#4ade80"/>
</svg>
